<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WS Chat (ChatGPT/Cursor-like)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div>
          <div class="header-title">WebSocket Chat</div>
          <div class="header-subtitle">
            Streaming answers like ChatGPT/Cursor
          </div>
        </div>
        <div class="header-actions">
          <div class="status" id="ws-status" role="status">Connecting...</div>
          <button type="button" id="retry-btn" class="retry-btn" hidden>
            Retry server
          </button>
        </div>
      </header>

      <main class="chat-container">
        <div id="messages" class="messages"></div>
      </main>

      <div class="input-bar">
        <textarea
          id="message-input"
          class="input"
          rows="1"
          aria-label="Message"
          placeholder="Type a message and press Enter..."
        ></textarea>
        <!-- Disabled until the script runs: without it nothing can be sent. -->
        <button type="button" id="send-btn" class="send-btn" disabled>
          Send
        </button>
      </div>
    </div>

    <script src="./env.js"></script>
    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
